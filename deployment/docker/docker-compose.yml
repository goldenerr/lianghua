# =============================================================================
# Quant Trading System — Docker Compose
# Usage: REDIS_PASSWORD=... CLICKHOUSE_PASSWORD=... docker compose up -d
# =============================================================================

services:
  # ── Main application ───────────────────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: production
    image: quant-trading:${QUANT_VERSION:-latest}
    container_name: quant-app
    restart: unless-stopped
    environment:
      - QUANT_ENV=${QUANT_ENV:-dev}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - CLICKHOUSE_URL=http://quant:${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}@clickhouse:8123
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data
      - ../../logs:/app/logs
    networks:
      - quant-net
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Redis (event bus + caching) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    volumes:
      - ../../redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    networks:
      - quant-net
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClickHouse (time-series data) ──────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: quant-clickhouse
    restart: unless-stopped
    volumes:
      - ../../clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - CLICKHOUSE_DB=quant
      - CLICKHOUSE_USER=quant
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: 262144
    networks:
      - quant-net
    mem_limit: 2048m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "quant",
          "--password",
          "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}",
          "--query",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (reverse proxy) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: quant-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8081}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - quant-net
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quant-net:
    driver: bridge
