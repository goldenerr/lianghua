name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.4.1"

jobs:
  # ── Code quality gate (blocks on failure) ──────────────────────────────────
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Black check
        run: poetry run black --check --diff src/ tests/

      - name: Ruff check
        run: poetry run ruff check src/ tests/

      - name: MyPy type check
        run: poetry run mypy src/

  # ── Security scan ──────────────────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Bandit SAST
        run: poetry run bandit -c pyproject.toml -r src/ -f json -o bandit-report.json

      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            gitleaks-report.json

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: quant
          CLICKHOUSE_USER: quant
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-${{ matrix.python-version }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with test --no-interaction

      - name: Run tests
        run: |
          poetry run pytest --cov=src/quant_trading --cov-report=xml --cov-report=term \
            -n auto --dist loadscope -v

      - name: Run explicit safety smoke test
        run: poetry run pytest -q tests/integration/test_smoke.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  # ── Build Docker image ─────────────────────────────────────────────────────
  build:
    name: "Build & Push Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, security, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry and locked dependencies
        run: |
          pipx install poetry==${{ env.POETRY_VERSION }}
          poetry install --only main --no-interaction

      - name: Build and verify signed artifact manifest
        env:
          QUANT_MANIFEST_SIGNING_KEY: ${{ secrets.QUANT_MANIFEST_SIGNING_KEY }}
        run: |
          test -n "$QUANT_MANIFEST_SIGNING_KEY"
          poetry run quant-cli build-manifest --key-id github-actions-release --schema-version v2026.05
          poetry run quant-cli manifest deployment/artifact-manifest.json --verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
