[tool.poetry]
name = "quant-trading-system"
version = "0.1.0"
description = "Production-grade multi-market quantitative trading system"
authors = ["goldenerr <goldenerr@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "quant_trading", from = "src" }]
license = "MIT"
repository = "https://github.com/goldenerr/quant-trading-system"
keywords = ["quantitative-trading", "backtesting", "risk-management", "algorithmic-trading"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pydantic = "^2.0"
pydantic-settings = "^2.0"
numpy = "^1.26"
pandas = "^2.0"
scipy = "^1.11"
polars = "^1.0"
pyarrow = "^24.0"
pyyaml = "^6.0"
click = "^8.0"
rich = "^13.0"
structlog = "^24.0"
typer = "^0.12"
httpx = "^0.27"
redis = "^5.0"
clickhouse-driver = "^0.2"

# Data sources (added progressively as features demand)
yfinance = {version = "^0.2", optional = true}
akshare = {version = "^1.0", optional = true}
ccxt = {version = "^4.0", optional = true}

# Backtesting (plugin-based, choose one or both)
backtrader = {version = "^1.9", optional = true}
# vectorbt-pro requires license; install separately
pandas-market-calendars = ">=4.4,<6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
pytest-asyncio = "^0.24"
pytest-mock = "^3.0"
pytest-xdist = "^3.0"
pytest-timeout = "^2.3"
black = "^24.0"
ruff = "^0.5"
mypy = "^1.10"
bandit = "^1.7"
pre-commit = "^3.0"
pandas-stubs = ">=2.0"
types-pyyaml = "^6.0"
ipython = "^8.0"
jupyterlab = "^4.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
pytest-asyncio = "^0.24"
pytest-timeout = "^2.3"

[tool.poetry.extras]
data-sources = ["yfinance", "akshare", "ccxt"]
backtesting = ["backtrader"]
all = ["yfinance", "akshare", "ccxt", "backtrader"]

[tool.poetry.scripts]
quant-cli = "quant_trading.cli:app"
quant-init = "quant_trading.cli:init"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ============================================================
# Tool configurations
# ============================================================

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "RUF001",  # Chinese domain text intentionally uses full-width punctuation
    "RUF002",  # Chinese audit/docstrings must remain human-readable
    "RUF003",  # Chinese explanatory comments are intentional
    "N803",  # Quant formulas conventionally use S/K/T/X arguments
    "N806",  # Quant matrix notation conventionally uses P/Q/Omega variables
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "tests/",
    ".venv/",
    "build/",
]

[[tool.mypy.overrides]]
module = [
    "akshare",
    "ccxt",
    "ccxt.*",
    "cupy",
    "numba",
    "pandas_market_calendars",
    "scipy",
    "scipy.*",
    "xgboost",
    "yfinance",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/quant_trading",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
timeout = 300

[tool.coverage.run]
source = ["src/quant_trading"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude = ["tests", ".venv"]
skips = ["B101"]  # assert used (allowed in tests)
