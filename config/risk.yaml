# Quant Trading System — Risk Management Parameters
# AGENTS.md §3: 所有参数统一在 config/risk.yaml 中配置
# V5.9 Production: n=35, 90d, sector cap=5, MDD safeguards tightened
# 2026-05-25 config-001: strict Pydantic validation enabled; no limit values changed.

# Position limits
max_position_pct: 0.20       # 单品种 ≤20%
max_per_sector: 5             # 行业上限 (V5.9)

# Leverage
max_total_leverage: 1.0       # A股无杠杆

# Daily loss limits
max_daily_loss_pct: 0.02
max_single_loss_pct: 0.005

# VaR
var_method: historical
var_confidence: 0.95
max_var_pct: 0.05

# Drawdown cascade (V5.9 tightened)
mdd_reduce_to_50pct: 0.10    # MDD 10% → 减仓至 50% (V5.9)
mdd_liquidate_all: 0.18       # MDD 18% → 全部平仓 (V5.9)
mdd_reduce_scale: 0.50

# Circuit breaker
circuit_breaker_daily_loss: 0.03
circuit_breaker_daily_loss_force: 0.05

# Liquidity
max_volume_pct: 0.10

# Equity curve protection
max_consecutive_losses: 5
max_weekly_loss_pct: 0.03

# Strategy parameters (V5.9)
strategy:
  top_n: 35
  rebalance_freq_days: 90
  factors: [rsi, bollinger, momentum, macd, vol_dev, low_vol]
  weights: {rsi: 0.25, bollinger: 0.25, momentum: 0.20, macd: 0.15, vol_dev: 0.10, low_vol: 0.05}
  sector_cap: 5

# Performance gates (AGENTS.md §9)
gates:
  min_sharpe: 1.2
  max_mdd: -0.15
  min_win_rate: 0.40
  max_decay: 0.30
