# Production account template
# AGENTS.md §2: 生产配置必须从 Vault 读取，此文件仅作模板参考
#
# Copy to: config/accounts/<account_name>.yaml only through the approved deployment process.
# The secret_ref is resolved at runtime by Vault / AWS Secrets Manager / sealed secrets.
#
# account_id: prod-001
# name: "Production Account"
# exchange: binance
# environment: prod
# enabled: true
# default_leverage: 2.0
# secret_ref: "vault://quant/accounts/prod-001/binance"
# NEVER place credentials, API keys, environment substitutions, or plaintext
# secret material in a production account YAML document.
